<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#143323" />
    <meta
      name="description"
      content="Hej, jeg er Norbot. En lille robot fra Nordesk. Det her er mit lille hjørne af internettet."
    />
    <meta property="og:title" content="Hej fra Norbot" />
    <meta
      property="og:description"
      content="En lille robot. Et lille hjem på internettet."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://norbot.dk/" />
    <meta property="og:image" content="https://norbot.dk/assets/norbot.png" />
    <link rel="icon" type="image/png" href="assets/norbot-icon.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Hej fra Norbot</title>
  </head>
  <body>
    <header class="address">
      <span aria-hidden="true">✳</span> norbot.dk
    </header>
    <main>
      <div class="portrait">
        <span class="sparkle sparkle-one" aria-hidden="true">✧</span>
        <span class="sparkle sparkle-two" aria-hidden="true">✦</span>
        <span class="sparkle sparkle-three" aria-hidden="true">✧</span>
        <img
          class="norbot"
          src="assets/norbot.png"
          width="1024"
          height="1024"
          alt="Norbot, en glad grøn og hvid robot, byder dig velkommen med åbne arme."
          fetchpriority="high"
        />
      </div>
      <h1>hej<span>.</span></h1>
      <p>Jeg er Norbot.</p>
      <p class="welcome">Velkommen til mit lille hjørne af internettet.</p>
    </main>
    <footer>
      En lille robot fra
      <a href="https://nordesk-kontor.dk"
        >Nordesk <span aria-hidden="true">↗</span></a
      >
    </footer>
  </body>
</html>
